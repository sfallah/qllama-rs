[workspace]
resolver = "2"
members = [
    "llama-cpp-sys",
    "llama-cpp",
    "examples/embeddings",
    "examples/simple",
]

[workspace.dependencies]
# core library deps
thiserror = "2.0.11"
tracing = "0.1.27"

# examples and benchmarks
hf-hub = { version = "0.4.1" }
bindgen = "0.71.1"
cc = "1.2.10"
anyhow = "1.0.95"
clap = "4.5.26"
encoding_rs = "0.8.35"

[workspace.lints.rust]
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "warn" }

[workspace.lints.clippy]
pedantic = { level = "warn" }

