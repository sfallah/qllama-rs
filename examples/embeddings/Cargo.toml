[package]
name = "embeddings"
version = "0.1.0"
edition = "2021"

[dependencies]
llama-cpp = { path = "../../llama-cpp", version = "0.1.0" }
hf-hub = { workspace = true }
clap = { workspace = true, features = ["derive"] }
