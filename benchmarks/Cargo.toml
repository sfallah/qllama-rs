[package]
name = "llama-cpp-rs-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
cc = "1.1.14"
anyhow = "1.0.44"
fast-text-splitter = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/fast-text-splitter.git", branch = "feat/merge_level"}
llama-cpp-2 = { git = "ssh://git@gitlab.com/qimiaio/qimia-ai-dev/rust-examples/llama-cpp-rs.git", branch = "release_0.1.79" }
candle-core = "0.6.0"


[dev-dependencies]
rayon = "1.5.1"
criterion = "0.5.1"
safetensors = "0.4.4"

[features]
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]

[[bench]]
name = "benchmarks"
harness = false