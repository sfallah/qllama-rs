[package]
name = "llama-cpp-rs-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
fast-text-splitter = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/fast-text-splitter.git", branch = "feat/merge_level_async_sent" }
llama-cpp = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/llama-cpp-rs.git", branch = "llama.cpp_b8969_2026-04-29" }
serde_json = "1.0.128"
serde = { version = "1.0.208", features = ["derive"] }
tokenizers = { version = "0.21.1", features = ["http", "onig", "esaxx_fast"] }
hf-hub = "0.5.0"
candle-core = "0.10.2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
rayon = "1.5.1"
criterion = "0.8.2"
indexmap = "2.8.0"
serial_test = "3"

[features]
default = ["metal"]
metal = ["llama-cpp/metal"]
cuda = ["llama-cpp/cuda"]
cuda-no-vmm = ["llama-cpp/cuda-no-vmm"]

[[bench]]
name = "benchmarks"
harness = false
