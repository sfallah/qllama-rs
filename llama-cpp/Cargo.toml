[package]
name = "llama-cpp"
description = "qimia-ai llama.cpp bindings for Rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
enumflags2 = "0.7.12"
llama-cpp-sys = { path = "../llama-cpp-sys", version = "0.1.0" }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-core = { workspace = true }
anyhow = "1.0.100"
encoding_rs = { workspace = true }
llguidance = { version = "1.7.2", optional = true }
toktrie = { version = "1.7.2", optional = true }

[dev-dependencies]
encoding_rs = { workspace = true }
hf-hub = { workspace = true }
serde_json = "1.0"
tracing-subscriber = { workspace = true }

[features]
default = ["openmp", "android-shared-stdcxx"]
cuda = ["llama-cpp-sys/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-sys/cuda-no-vmm"]
metal = ["llama-cpp-sys/metal"]
dynamic-link = ["llama-cpp-sys/dynamic-link"]
vulkan = ["llama-cpp-sys/vulkan"]
openmp = ["llama-cpp-sys/openmp"]
rocm = ["llama-cpp-sys/rocm"]
sampler = []
# Only has an impact on Android.
android-shared-stdcxx = ["llama-cpp-sys/shared-stdcxx"]
android-static-stdcxx = ["llama-cpp-sys/static-stdcxx"]
mtmd = ["llama-cpp-sys/mtmd"]
system-ggml = ["llama-cpp-sys/system-ggml"]
system-ggml-static = ["llama-cpp-sys/system-ggml-static"]
llguidance = ["dep:llguidance", "dep:toktrie"]


[target.'cfg(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "arm64")))'.dependencies]
llama-cpp-sys = { path = "../llama-cpp-sys", version = "0.1.0", features = [
    "metal",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["sampler"]

[[example]]
name = "usage"
path = "../examples/usage.rs"

[[example]]
name = "tools"
path = "../examples/tools.rs"

[[example]]
name = "tools_reasoning"
path = "../examples/tools_reasoning.rs"

[[example]]
name = "openai_stream"
path = "../examples/openai_stream.rs"

[[example]]
name = "llguidance"
path = "../examples/llguidance.rs"
required-features = ["llguidance"]
